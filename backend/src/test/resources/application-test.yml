# Test profile configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  flyway:
    enabled: false  # Disable Flyway for unit tests

server:
  port: 0  # Random port

logging:
  level:
    root: WARN
    com.afora.backend: INFO
