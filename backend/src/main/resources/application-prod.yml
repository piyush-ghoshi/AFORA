# Production profile — all secrets injected via environment variables.
# DO NOT hardcode credentials here.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon serverless Postgres needs shorter connection timeout
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5   # Keep low for free tier

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    validate-on-migrate: true

server:
  # Render sets $PORT dynamically; default to 8080 for local Docker runs
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.afora.backend: INFO

cors:
  allowed-origins: ${CORS_ORIGINS:https://your-app.onrender.com}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600
