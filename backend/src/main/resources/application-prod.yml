# Production profile configuration (placeholder)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    show-sql: false
  
  flyway:
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.academia.backend: INFO

# Use strong secret in production
jwt:
  secret: ${JWT_SECRET}
