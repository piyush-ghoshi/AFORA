# Development profile configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/afora_dev
    username: afora_user
    password: afora_pass
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.afora.backend: DEBUG
